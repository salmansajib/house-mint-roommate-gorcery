<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#14231e" />
      <stop offset="60%" stop-color="#0b1411" />
      <stop offset="100%" stop-color="#080c0a" />
    </radialGradient>
    <linearGradient id="mintLeafGrad" x1="256" y1="90" x2="256" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="mintGableGrad" x1="120" y1="210" x2="392" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="mintGlow" x="10%" y="10%" width="80%" height="80%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="114" stroke="#10b981" stroke-opacity="0.25" stroke-width="2.5" />

  <!-- Logo Artwork -->
  <g filter="url(#mintGlow)">
    <!-- House Foundation & Walls -->
    <path
      d="M172 268 L124 306 L154 306 L154 424 C154 428.418 157.582 432 162 432 L350 432 C354.418 432 358 428.418 358 424 L358 306 L388 306 L340 268"
      fill="url(#mintLeafGrad)"
    />

    <!-- Cutout Door and Window (Using obsidian background tone) -->
    <rect x="238" y="342" width="36" height="90" rx="4" fill="#080c0a" />
    <rect x="180" y="324" width="30" height="38" rx="4" fill="#080c0a" />

    <!-- Stylized Geometric Mint Leaf Crest -->
    <!-- Outer Leaf Contour with subtle serrated lobes -->
    <path
      d="M256 86
         C270 120 292 136 304 150
         C320 168 322 192 316 216
         C312 230 300 244 286 256
         C274 266 264 274 256 288
         C248 274 238 266 226 256
         C212 244 200 230 196 216
         C190 192 192 168 208 150
         C220 136 242 120 256 86 Z"
      fill="url(#mintLeafGrad)"
    />

    <!-- Leaf Vein Ribs (Carved negative spaces) -->
    <!-- Central vertical vein -->
    <path d="M256 102 L256 272" stroke="#080c0a" stroke-width="8" stroke-linecap="round" />

    <!-- Branching side veins -->
    <path d="M256 142 Q280 156 296 172" stroke="#080c0a" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M256 142 Q232 156 216 172" stroke="#080c0a" stroke-width="7" stroke-linecap="round" fill="none" />

    <path d="M256 190 Q278 206 292 224" stroke="#080c0a" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M256 190 Q234 206 220 224" stroke="#080c0a" stroke-width="7" stroke-linecap="round" fill="none" />

    <path d="M256 236 Q270 248 278 260" stroke="#080c0a" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M256 236 Q242 248 234 260" stroke="#080c0a" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Clean crisp roof gable wings framing the leaf -->
    <path
      d="M138 296 L226 230 C222 236 218 244 216 252 L150 302 Z"
      fill="url(#mintGableGrad)"
      opacity="0.8"
    />
    <path
      d="M374 296 L286 230 C290 236 294 244 296 252 L362 302 Z"
      fill="url(#mintGableGrad)"
      opacity="0.8"
    />
  </g>
</svg>